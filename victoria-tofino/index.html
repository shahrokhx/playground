<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Victoria + Tofino Trip Planner</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f4ef;color:#17201d;margin:0;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:28px;text-align:center}.spin{width:34px;height:34px;border:4px solid #d5dfdb;border-top-color:#214e45;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#8a392b}</style></head><body><div class="box"><div class="spin"></div><h2>Loading Victoria + Tofino planner…</h2><p>One moment — assembling the interactive trip dashboard.</p></div><script>(async()=>{try{let html='';for(let i=0;i<8;i++){const r=await fetch(`chunks/${String(i).padStart(2,'0')}.txt`);if(!r.ok)throw new Error(`Could not load planner part ${i}`);html+=await r.text();}document.open();document.write(html);document.close();}catch(e){document.querySelector('.box').innerHTML='<h2 class="err">Planner could not load</h2><p>'+e.message+'</p><p>Please refresh the page.</p>';}})();</script></body></html>
